name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ldid
        if: runner.os == 'macOS'
        run: brew install ldid

      - name: Build
        run: make

      - name: Smoke test
        run: |
          python -m pip install -r requirements.txt
          python decrypt.py --help
          file transform

      - name: Package
        run: |
          pkg="fairplay-decrypt-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp README.md requirements.txt decrypt.py core.py transform transform_const_data.bin "dist/$pkg/"
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p "dist/$pkg/credential-retrieval/build"
            cp credential-retrieval/README.md credential-retrieval/retrieve.py credential-retrieval/native_ssh.py "dist/$pkg/credential-retrieval/"
            cp -R credential-retrieval/build/bundle "dist/$pkg/credential-retrieval/build/"
          fi
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: fairplay-decrypt-${{ matrix.name }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
